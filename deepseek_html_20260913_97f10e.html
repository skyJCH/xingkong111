<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xingkongJCH · 个人主页</title>
    <style>
        /* ========== 全局重置 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 在根元素上声明变量默认值，JS 会动态更新 */
        :root {
            --mx: 0;
            --my: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            overflow: hidden;
            position: relative;
        }

        /* ========== 星空背景（视差跟随鼠标） ========== */
        .stars {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            /* ⚠️ 这里不要定义 --mx / --my，否则会遮蔽 :root 上的值 */
        }

        .stars::before,
        .stars::after {
            content: '';
            position: absolute;
            /* 略微扩大范围，避免位移后边缘露出空白 */
            top: -40px;
            left: -40px;
            width: calc(100% + 80px);
            height: calc(100% + 80px);
            background-image:
                radial-gradient(2px 2px at 20px 30px, #fff, transparent),
                radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), transparent),
                radial-gradient(2px 2px at 50px 160px, #fff, transparent),
                radial-gradient(2px 2px at 90px 40px, rgba(255,255,255,0.6), transparent),
                radial-gradient(2px 2px at 130px 80px, #fff, transparent),
                radial-gradient(2px 2px at 160px 120px, rgba(255,255,255,0.7), transparent),
                radial-gradient(2px 2px at 200px 50px, #fff, transparent),
                radial-gradient(2px 2px at 250px 190px, rgba(255,255,255,0.5), transparent),
                radial-gradient(2px 2px at 300px 100px, #fff, transparent),
                radial-gradient(2px 2px at 350px 30px, rgba(255,255,255,0.9), transparent),
                radial-gradient(2px 2px at 400px 170px, #fff, transparent),
                radial-gradient(2px 2px at 450px 60px, rgba(255,255,255,0.6), transparent);
            background-size: 500px 200px;
            background-repeat: repeat;
            will-change: transform, opacity;
        }

        /* 远层星星：位移幅度较小 */
        .stars::before {
            animation: twinkle 4s ease-in-out infinite alternate;
            transform: translate3d(
                calc(var(--mx) * 16px),
                calc(var(--my) * 16px),
                0
            );
        }

        /* 近层星星：位移幅度较大，形成纵深 */
        .stars::after {
            background-size: 350px 140px;
            opacity: 0.5;
            animation: twinkle 6s ease-in-out infinite alternate;
            animation-delay: 1s;
            transform: translate3d(
                calc(var(--mx) * 32px),
                calc(var(--my) * 32px),
                0
            );
        }

        @keyframes twinkle {
            0% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        /* ========== 卡片通用样式 ========== */
        .card {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 56px 48px 48px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
            max-width: 440px;
            width: 90%;
            max-height: 92vh;
            overflow-y: auto;
            /* 卡片跟随鼠标做极轻微反向位移，增强空间感 */
            transform: translate3d(
                calc(var(--mx) * -5px),
                calc(var(--my) * -5px),
                0
            );
            transition: transform 0.15s linear;
        }

        /* 视图切换 */
        .view {
            display: none;
        }

        .view.active {
            display: block;
            animation: fadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 滚动条美化 */
        .card::-webkit-scrollbar {
            width: 5px;
        }
        .card::-webkit-scrollbar-track {
            background: transparent;
        }
        .card::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
        }
        .card {
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.15) transparent;
        }

        /* ========== 主页元素 ========== */
        .avatar {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00a1d6, #0066a1, #1b2735);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 34px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 1px;
            box-shadow:
                0 0 0 3px rgba(0, 161, 214, 0.2),
                0 0 30px rgba(0, 161, 214, 0.15);
            user-select: none;
        }

        .username {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            background: linear-gradient(135deg, #ffffff 0%, #a8d8ea 60%, #00a1d6 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 0.92rem;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 36px;
        }

        /* ========== 按钮组 ========== */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* ============================================================
           液态玻璃按钮 — 通用样式
           通过 --hue 变量控制每个按钮的色调
           ============================================================ */
        .btn-liquid {
            --hue: 200;
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px 40px;
            font-size: 1.05rem;
            font-weight: 600;
            font-family: inherit;
            letter-spacing: 0.5px;
            color: #fff;
            text-decoration: none;
            cursor: pointer;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            isolation: isolate;
            overflow: hidden;
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.35);
            background:
                linear-gradient(
                    145deg,
                    hsla(var(--hue), 100%, 92%, 0.28) 0%,
                    hsla(var(--hue), 90%, 75%, 0.14) 30%,
                    hsla(var(--hue), 85%, 60%, 0.10) 55%,
                    hsla(var(--hue), 80%, 70%, 0.18) 100%
                );
            backdrop-filter: blur(22px) saturate(200%);
            -webkit-backdrop-filter: blur(22px) saturate(200%);
            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.32),
                inset 0 2px 6px rgba(255, 255, 255, 0.42),
                inset 0 -3px 10px hsla(var(--hue), 100%, 70%, 0.22),
                inset 0 0 24px rgba(255, 255, 255, 0.06),
                0 0 26px hsla(var(--hue), 95%, 65%, 0.20);
            transition:
                transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
                box-shadow 0.35s ease,
                filter 0.35s ease,
                border-color 0.35s ease;
        }

        /* 内部液态光斑 — 左上 */
        .btn-liquid::before {
            content: '';
            position: absolute;
            width: 160px;
            height: 160px;
            border-radius: 50%;
            top: -70px;
            left: -40px;
            z-index: 0;
            pointer-events: none;
            background: radial-gradient(circle,
                hsla(var(--hue), 100%, 85%, 0.75) 0%,
                hsla(var(--hue), 100%, 75%, 0.25) 40%,
                transparent 72%);
            filter: blur(22px);
            animation: liquidFlow1 9s ease-in-out infinite alternate;
        }

        /* 内部液态光斑 — 右下 */
        .btn-liquid::after {
            content: '';
            position: absolute;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            bottom: -70px;
            right: -40px;
            z-index: 0;
            pointer-events: none;
            background: radial-gradient(circle,
                hsla(calc(var(--hue) + 40), 100%, 82%, 0.6) 0%,
                hsla(calc(var(--hue) + 40), 100%, 72%, 0.18) 42%,
                transparent 72%);
            filter: blur(24px);
            animation: liquidFlow2 11s ease-in-out infinite alternate;
        }

        @keyframes liquidFlow1 {
            0%   { transform: translate(0, 0) scale(1); }
            50%  { transform: translate(80px, 40px) scale(1.25); }
            100% { transform: translate(30px, 80px) scale(0.95); }
        }

        @keyframes liquidFlow2 {
            0%   { transform: translate(0, 0) scale(1); }
            50%  { transform: translate(-70px, -30px) scale(1.2); }
            100% { transform: translate(-30px, -70px) scale(0.9); }
        }

        /* 内容层 */
        .btn-liquid > * {
            position: relative;
            z-index: 1;
        }

        .btn-liquid svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
            flex-shrink: 0;
            filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.3));
        }

        /* 悬停：光斑加速、玻璃变亮 */
        .btn-liquid:hover {
            border-color: rgba(255, 255, 255, 0.45);
            filter: brightness(1.15) saturate(1.1);
            transform: translateY(-3px) scale(1.015);
            box-shadow:
                0 16px 40px rgba(0, 0, 0, 0.38),
                inset 0 2px 8px rgba(255, 255, 255, 0.6),
                inset 0 -3px 12px hsla(var(--hue), 100%, 75%, 0.3),
                inset 0 0 30px rgba(255, 255, 255, 0.1),
                0 0 42px hsla(var(--hue), 95%, 68%, 0.45);
        }

        .btn-liquid:hover::before,
        .btn-liquid:hover::after {
            filter: blur(18px) brightness(1.3);
            animation-duration: 4s;
        }

        /* 按下：柔和下沉 */
        .btn-liquid:active {
            transform: translateY(-1px) scale(0.985);
            filter: brightness(0.95) saturate(1.05);
            box-shadow:
                0 5px 16px rgba(0, 0, 0, 0.35),
                inset 0 3px 12px rgba(0, 0, 0, 0.22),
                inset 0 1px 4px rgba(255, 255, 255, 0.3),
                0 0 20px hsla(var(--hue), 90%, 65%, 0.25);
        }

        /* ---------- 各按钮色调 ---------- */
        .hue-bili    { --hue: 200; }
        .hue-video   { --hue: 340; }
        .hue-win     { --hue: 152; }

        /* ========== 底部文字 ========== */
        .footer-note {
            margin-top: 28px;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.18);
            letter-spacing: 1px;
        }

        /* ========== Windows 下载页 ========== */
        .card-windows {
            max-width: 480px;
            padding: 30px 32px 34px;
            text-align: left;
        }

        .win-top {
            display: flex;
            margin-bottom: 22px;
        }

        /* 返回按钮 — 液态玻璃风格 */
        .back-btn {
            --hue: 210;
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 9px 18px 9px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            font-family: inherit;
            color: #fff;
            cursor: pointer;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.22);
            isolation: isolate;
            overflow: hidden;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
            background:
                linear-gradient(
                    145deg,
                    hsla(var(--hue), 100%, 92%, 0.22) 0%,
                    hsla(var(--hue), 90%, 75%, 0.10) 45%,
                    hsla(var(--hue), 80%, 70%, 0.16) 100%
                );
            backdrop-filter: blur(18px) saturate(190%);
            -webkit-backdrop-filter: blur(18px) saturate(190%);
            box-shadow:
                0 6px 18px rgba(0, 0, 0, 0.3),
                inset 0 2px 5px rgba(255, 255, 255, 0.35),
                inset 0 -2px 8px hsla(var(--hue), 100%, 70%, 0.18),
                inset 0 0 18px rgba(255, 255, 255, 0.05);
            transition:
                transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1),
                box-shadow 0.3s ease,
                filter 0.3s ease,
                border-color 0.3s ease;
        }

        .back-btn::before {
            content: '';
            position: absolute;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            top: -40px;
            left: -20px;
            z-index: 0;
            pointer-events: none;
            background: radial-gradient(circle,
                hsla(var(--hue), 100%, 85%, 0.55) 0%,
                transparent 70%);
            filter: blur(16px);
            animation: liquidFlow1 8s ease-in-out infinite alternate;
        }

        .back-btn > * {
            position: relative;
            z-index: 1;
        }

        .back-btn svg {
            width: 15px;
            height: 15px;
        }

        .back-btn:hover {
            border-color: rgba(255, 255, 255, 0.42);
            filter: brightness(1.18);
            transform: translateX(-3px);
            box-shadow:
                0 10px 26px rgba(0, 0, 0, 0.36),
                inset 0 2px 6px rgba(255, 255, 255, 0.5),
                inset 0 -2px 10px hsla(var(--hue), 100%, 72%, 0.25),
                0 0 28px hsla(var(--hue), 95%, 68%, 0.4);
        }

        .back-btn:active {
            transform: translateX(-1px) scale(0.97);
            filter: brightness(0.94);
        }

        .win-title {
            font-size: 1.55rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #ffffff 0%, #a7f3d0 60%, #34d399 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }

        .win-sub {
            text-align: center;
            font-size: 0.78rem;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 2px;
            margin-bottom: 26px;
        }

        .dl-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* 下载条目 — 液态玻璃卡片 */
        .dl-item {
            --hue: 152;
            position: relative;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            text-decoration: none;
            color: #fff;
            isolation: isolate;
            overflow: hidden;
            background:
                linear-gradient(
                    145deg,
                    hsla(var(--hue), 95%, 90%, 0.14) 0%,
                    hsla(var(--hue), 85%, 70%, 0.06) 45%,
                    hsla(var(--hue), 80%, 65%, 0.10) 100%
                );
            backdrop-filter: blur(18px) saturate(180%);
            -webkit-backdrop-filter: blur(18px) saturate(180%);
            box-shadow:
                0 6px 20px rgba(0, 0, 0, 0.24),
                inset 0 2px 5px rgba(255, 255, 255, 0.22),
                inset 0 -2px 8px hsla(var(--hue), 100%, 70%, 0.12),
                inset 0 0 20px rgba(255, 255, 255, 0.03);
            transition:
                transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1),
                box-shadow 0.3s ease,
                filter 0.3s ease,
                border-color 0.3s ease;
        }

        .dl-item::before {
            content: '';
            position: absolute;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            top: -60px;
            left: -30px;
            z-index: 0;
            pointer-events: none;
            background: radial-gradient(circle,
                hsla(var(--hue), 100%, 85%, 0.45) 0%,
                transparent 70%);
            filter: blur(20px);
            animation: liquidFlow1 10s ease-in-out infinite alternate;
        }

        .dl-item > * {
            position: relative;
            z-index: 1;
        }

        .dl-item:hover {
            border-color: rgba(255, 255, 255, 0.35);
            filter: brightness(1.14);
            transform: translateY(-2px);
            box-shadow:
                0 12px 28px rgba(0, 0, 0, 0.32),
                inset 0 2px 7px rgba(255, 255, 255, 0.4),
                inset 0 -2px 10px hsla(var(--hue), 100%, 72%, 0.2),
                0 0 32px hsla(var(--hue), 95%, 68%, 0.35);
        }

        .dl-item:hover::before {
            filter: blur(16px) brightness(1.3);
            animation-duration: 4.5s;
        }

        .dl-item:active {
            transform: translateY(0) scale(0.99);
            filter: brightness(0.95);
        }

        .dl-icon {
            width: 42px;
            height: 42px;
            flex-shrink: 0;
            border-radius: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.16);
            box-shadow:
                inset 0 1px 3px rgba(255, 255, 255, 0.28),
                0 2px 8px rgba(0, 0, 0, 0.15);
            color: #fff;
        }

        .dl-icon svg {
            width: 22px;
            height: 22px;
        }

        .dl-icon.i-blue   { color: #bfdbfe; }
        .dl-icon.i-cyan   { color: #a5f3fc; }
        .dl-icon.i-purple { color: #ddd6fe; }

        .dl-body {
            flex: 1;
            min-width: 0;
            text-align: left;
        }

        .dl-title {
            display: block;
            font-size: 0.98rem;
            font-weight: 600;
            margin-bottom: 2px;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.35);
        }

        .dl-desc {
            display: block;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.52);
        }

        .dl-arrow {
            flex-shrink: 0;
            color: rgba(255, 255, 255, 0.32);
            transition: color 0.25s, transform 0.25s;
        }

        .dl-arrow svg {
            width: 16px;
            height: 16px;
            display: block;
        }

        .dl-item:hover .dl-arrow {
            color: rgba(255, 255, 255, 0.85);
            transform: translateX(3px);
        }

        .win-note {
            margin-top: 24px;
            font-size: 0.72rem;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.28);
            text-align: center;
        }

        /* ========== 响应式 ========== */
        @media (max-width: 480px) {
            .card {
                padding: 40px 28px 36px;
                border-radius: 22px;
            }

            .card-windows {
                padding: 24px 22px 28px;
            }

            .avatar {
                width: 72px;
                height: 72px;
                font-size: 28px;
                margin-bottom: 20px;
            }

            .username {
                font-size: 1.6rem;
            }

            .subtitle {
                font-size: 0.78rem;
                margin-bottom: 28px;
            }

            .btn-liquid {
                padding: 14px 32px;
                font-size: 0.95rem;
            }

            .btn-liquid::before,
            .btn-liquid::after {
                width: 120px;
                height: 120px;
            }

            .win-title {
                font-size: 1.3rem;
            }

            .dl-item {
                padding: 12px 14px;
                gap: 12px;
            }

            .dl-icon {
                width: 38px;
                height: 38px;
            }

            .dl-title {
                font-size: 0.92rem;
            }
        }

        /* 尊重用户减少动效偏好 */
        @media (prefers-reduced-motion: reduce) {
            .stars::before,
            .stars::after {
                transform: none !important;
            }
            .card {
                transform: none !important;
            }
        }
    </style>
</head>
<body>

    <!-- 星空背景（跟随鼠标视差） -->
    <div class="stars"></div>

    <!-- ==================== 主页 ==================== -->
    <main class="card view active" id="page-home">
        <!-- 头像标识 -->
        <div class="avatar">X</div>

        <!-- 用户名 -->
        <h1 class="username">xingkongJCH</h1>
        <p class="subtitle">Welcome to my space</p>

        <!-- 按钮组 -->
        <div class="btn-group">
            <!-- 1. 进入 B 站空间 -->
            <a
                href="https://space.bilibili.com/3706985165883748?spm_id_from=333.1007.0.0"
                target="_blank"
                rel="noopener noreferrer"
                class="btn-liquid hue-bili"
                aria-label="进入B站空间"
            >
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M17.5 3.5l-2.5 2.5h-5.8L6.7 3.5 5.3 4.9 7.9 7.5H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2h-3.9l2.6-2.6-1.4-1.4zM4 10h16v8H4v-8zm5 2v4l4-2-4-2z"/>
                </svg>
                <span>进入B站空间</span>
            </a>

            <!-- 2. 最新视频 -->
            <a
                href="https://www.bilibili.com/video/BV1kBYi6ZEmk/?spm_id_from=333.1387.homepage.video_card.click&vd_source=fdfc58d24c87481e0ea7dd39a5ea5d2f"
                target="_blank"
                rel="noopener noreferrer"
                class="btn-liquid hue-video"
                aria-label="观看最新视频"
            >
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M8 5v14l11-7z"/>
                </svg>
                <span>最新视频</span>
            </a>

            <!-- 3. Windows镜像下载 -->
            <a
                href="#windows"
                class="btn-liquid hue-win"
                aria-label="Windows镜像下载"

    <script>
        (function () {
            /* ============================================================
               鼠标视差：星空与卡片跟随鼠标轻微移动
               ============================================================ */
            var root = document.documentElement;
            var targetX = 0, targetY = 0;   // 目标归一化偏移 -1 ~ 1
            var currentX = 0, currentY = 0; // 缓动后的实际值
            var rafId = null;

            /* 缓动系数：越小越柔和 */
            var EASE = 0.075;

            function setVars() {
                root.style.setProperty('--mx', currentX.toFixed(4));
                root.style.setProperty('--my', currentY.toFixed(4));
            }

            function animate() {
                currentX += (targetX - currentX) * EASE;
                currentY += (targetY - currentY) * EASE;

                setVars();

                /* 差值足够小时暂停循环，省电；有移动时再启动 */
                if (Math.abs(targetX - currentX) > 0.001 ||
                    Math.abs(targetY - currentY) > 0.001) {
                    rafId = requestAnimationFrame(animate);
                } else {
                    currentX = targetX;
                    currentY = targetY;
                    setVars();
                    rafId = null;
                }
            }

            function kick() {
                if (rafId === null) {
                    rafId = requestAnimationFrame(animate);
                }
            }

            window.addEventListener('mousemove', function (e) {
                var w = window.innerWidth || 1;
                var h = window.innerHeight || 1;
                targetX = (e.clientX / w - 0.5) * 2;   // -1 ~ 1
                targetY = (e.clientY / h - 0.5) * 2;
                kick();
            }, { passive: true });

            /* 鼠标移出窗口时缓缓回中 */
            document.addEventListener('mouseleave', function () {
                targetX = 0;
                targetY = 0;
                kick();
            });

            /* 触摸设备：手指拖动也能带动星空 */
            window.addEventListener('touchmove', function (e) {
                var t = e.touches && e.touches[0];
                if (!t) return;
                var w = window.innerWidth || 1;
                var h = window.innerHeight || 1;
                targetX = (t.clientX / w - 0.5) * 2;
                targetY = (t.clientY / h - 0.5) * 2;
                kick();
            }, { passive: true });

            window.addEventListener('touchend', function () {
                targetX = 0;
                targetY = 0;
                kick();
            });

            /* ---------- 视图切换 ---------- */
            var pages = {
                '': document.getElementById('page-home'),
                '#windows': document.getElementById('page-windows')
            };

            function syncView() {
                var key = pages[location.hash] ? location.hash : '';
                var target = pages[key];

                document.querySelectorAll('.view').forEach(function (el) {
                    el.classList.remove('active');
                });
                target.classList.add('active');
                target.scrollTop = 0;
            }

            window.addEventListener('hashchange', syncView);
            syncView();

            /* 返回按钮 */
            document.getElementById('backBtn').addEventListener('click', function () {
                if (location.hash) {
                    history.back();
                    setTimeout(function () {
                        if (location.hash) {
                            location.hash = '';
                        }
                    }, 80);
                }
            });
        })();
    </script>
